    Experience:
      - company: Bracket Bot Inc.
        position: Robotics Research Engineer
        location: San Francisco, CA, USA
        start_date: 2026-10
        end_date: present
        highlights:
          - Design, develop, test, and deploy robotics software and machine learning models for manipulation, integrated with the company's robotic hardware; design and build end-effector hardware as needed.

      - company: Aerospace Mechatronics Lab, McGill University
        position: "Graduate Research Assistant (Advisor: Prof. Inna Sharf)"
        location: Montréal, QC, Canada
        start_date: 2024-08
        end_date: 2026-09
        highlights:
          - Developed a GPU-parallel Isaac Lab simulation of a hydraulic forestry crane clearing dense log piles, tuned from field measurements.
          - Trained a PointNet-based grasp-targeting policy on raw point clouds by behavior cloning from a privileged expert, then fine-tuned it with reinforcement learning; the fine-tuned policy clears 99 of 100 simulated piles.
          - Calibrated the simulation against the physical crane and deployed the policies unchanged in twelve field trials, depositing up to 93.8% of log inventory versus 80.4% for a deployed heuristic baseline (M.Sc. thesis; under review at ICRA 2027).

      - company: FPInnovations
        position: Automation Research Intern, Mitacs Accelerate
        location: Pointe-Claire, QC, Canada
        start_date: 2025-11
        end_date: 2026-06
        highlights:
          - Mitacs Accelerate internship on the project "Development of Autonomy for Log-loading Machines in Canadian Mill Yards." Calibrated the simulated sensing and control of a trailer-mounted hydraulic forestry crane against the physical testbed and ran field trials deploying learned grasp-targeting policies against the deployed heuristic baseline for automated log-pile clearing.

      - company: '<a href="https://nist.mni.mcgill.ca/">NeuroImaging and Surgical Technologies Lab</a>, <a href="https://www.mcgill.ca/neuro/">The Neuro</a> (Montreal Neurological Institute-Hospital), McGill University'
        position: "Undergraduate Research Assistant (Advisor: Prof. Louis Collins)"
        location: Montréal, QC, Canada
        start_date: 2023-08
        end_date: 2025-09
        highlights:
          - Led a team of four to build a multi-camera optical tracker for occlusion-robust, sub-millimeter surgical tool tracking; 2nd place, Engine Capstone Design Prize for Entrepreneurship.
          - Co-designed and fabricated the camera fixture for the operating room light; co-implemented multi-camera calibration and ArUco-based tracking.
          - Developed an adaptive Kalman-filter fusion strategy with online per-camera noise estimation; released hardware, software, and a multi-view video dataset as an open benchmark (submitted to Medical Image Analysis).

      - company: Aerospace Mechatronics Lab, McGill University
        position: "Undergraduate Research Assistant, SURE (Advisor: Prof. Inna Sharf)"
        location: Montréal, QC, Canada
        start_date: 2023-05
        end_date: 2023-08
        highlights:
          - Created datasets and trained a CNN for grapple and log segmentation, grapple-opening prediction, and log counting; integrated a draw-wire sensor on the grapple for experimental validation.
          - Designed an experimental setup emulating a log-loader manipulator for anti-sway trajectory-planner validation (published at ICRA 2025).

      - company: Lockheed Martin CES
        position: Jet Engine MRO Engineering Intern
        location: Montréal, QC, Canada
        start_date: 2022-01
        end_date: 2022-08
        highlights:
          - Created a dataset of 100+ labelled images from defective shop floor parts using a stereo-microscope. Drafted AI integration sections for an $8M CAD NGen proposal on automated visual inspection of HPT parts.
          - Designed tools for jet engine maintenance tasks in AutoCAD; produced drawings and procured materials for 10+ tools. Dispositioned 12 cases of defects on engine parts, saving over $150K CAD.

      - company: Bombardier Aerospace
        position: Project Engineering Intern
        location: Montréal, QC, Canada
        start_date: 2021-05
        end_date: 2021-12
        highlights:
          - Tracked stress and materials & processes items from inception to disposition using Power BI. Developed a data tracking tool for managing aircraft design modifications using VBA, reducing weekly workload by 4 person-hours.

    Leadership:
      - bullet: "**Co-Founder**, OPSIS, Montréal (May 2024 – May 2026). Developed a low-cost, occlusion-resilient surgical tool tracking system for minimally invasive guided surgery. Completed McGill Engine's TechAccel experiential learning program. Awarded the Ian McLachlin Prize for Entrepreneurship by McGill Engine. Supervised a business intern during summer 2025, sponsored by McGill Engine."
      - bullet: "**Co-Captain / Captain / Structures Lead**, McGill Vertical Flight Society Projects Team (Aug. 2020 – June 2023). Co-Captain (2022–23): co-led twenty students to design and build a 20 lb, 10 ft blended-wing tail-sitter with hover-to-cruise transition; ran workshops on electronics, Arduino, and composites; 3rd place and Perseverance Award, 2023 VFS DBVF competition. Captain (2021–22): led eight students to build a 15 lb, 6.5 ft quadrotor with airfoils; designed custom frame parts, Abaqus FEA, and an Arduino-controlled wing-tilt mechanism; Best Drawing Package award. Structures Lead (2020–21): led the sub-team that designed and built the team's first custom hex-copter frame in SolidWorks."
      - bullet: "**VP External**, McGill Institute for Aerospace Engineering (June 2021 – June 2022). Organized the inaugural AeroFair, a job fair with recruiters from 6 aerospace companies, attended by 100+ students. Organized two Python workshops: Intro to Git/APIs and CNNs for Fault Classification."
      - bullet: "**Captain / Team Member**, Canadian Robotics Competition (CRC) teams, Montréal/Laval (Sep. 2016 – May 2019). Three seasons of competition robotics: Marianopolis College team captain (2018–2019) and member (2017–2018); Laval Senior Academy team member (2016–2017)."

