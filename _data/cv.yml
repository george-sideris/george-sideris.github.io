    Research Experience:
      - company: Aerospace Mechatronics Lab, McGill University
        position: "Graduate Research Assistant (Advisor: Prof. Inna Sharf)"
        location: Montréal, QC, Canada
        start_date: 2024-08
        end_date: present
        highlights:
          - Built a high-fidelity, GPU-parallel Isaac Lab simulation of a forestry crane clearing log piles.
          - Trained a PointNet-based grasp-targeting policy by behavior cloning from a privileged-state expert and fine-tuned it with PPO using an asymmetric actor-critic, reaching 98.2% pile clearing from raw point clouds.
          - Calibrated the simulation against the physical crane testbed and ran field trials comparing learned policies against the deployed heuristic.

      - company: NeuroImaging and Surgical Technologies Lab, McGill University
        position: "Undergraduate Research Assistant (Advisor: Prof. D. Louis Collins)"
        location: Montréal, QC, Canada
        start_date: 2023-08
        end_date: 2025-09
        highlights:
          - Led a team of four to build LARK, a multi-camera optical tracker for occlusion-robust, sub-millimeter surgical tool tracking.
          - Co-designed and fabricated the fixture that mounts the cameras on the operating-room light; co-implemented multi-camera calibration and ArUco-based tracking.
          - Designed and implemented the adaptive Kalman-filter fusion strategy. 2nd place, McGill Engine Capstone Design Prize for Entrepreneurship.

      - company: Aerospace Mechatronics Lab, McGill University
        position: "Undergraduate Research Assistant, SURE (Advisor: Prof. Inna Sharf)"
        location: Montréal, QC, Canada
        start_date: 2023-05
        end_date: 2023-08
        highlights:
          - Created datasets to train a CNN for grapple and log segmentation, grapple-opening prediction and log counting; integrated a draw-wire sensor on the grapple for experimental validation.
          - Designed an experimental setup emulating a log-loader manipulator for anti-sway trajectory planner validation (published at ICRA 2025).

